services:
  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8001:8001"
    networks:
      - ecommerce-network
  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8002:8002"
    depends_on:
      - product-service
    networks:
      - ecommerce-network
  customer-service:
    build: ./customer-service
    container_name: customer-service
    ports:
      - "8003:8003"
    networks:
      - ecommerce-network
networks:
  ecommerce-network:
    driver: bridge